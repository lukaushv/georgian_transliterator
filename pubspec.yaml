name: georgian_transliterator
description: A Dart package for converting and transliterating Georgian scripts such as Mkhedruli, Asomtavruli, Nuskhuri, and bicameral writing styles like Khutsuri.
version: 0.1.0
# repository: https://github.com/my_org/my_repo

topics:
  - georgian
  - transliteration
  - unicode
  - text
  - language

environment:
  sdk: ^3.7.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
